<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детектор грибов</title>
</head>
<body>
    <h1>Загрузите фото гриба</h1>
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit">Определить</button>
    </form>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if filename %}
    <hr>
    <h2>Результат:</h2>
    <p><strong>Вид:</strong> {{ info.name_ru }}</p>
    <p><strong>Статус:</strong> {{ info.status }}</p>
    <p><strong>Вероятность:</strong> {{ confidence }}%</p>
    <div>
        <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Original" style="max-width: 500px;">
    </div>
    {% endif %}
</body>
</html>
